name: 不具合の報告 / Bug report
description: 落ちる、動かない、期待と違う / Something crashes or doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ご報告ありがとうございます。
        **個人の写真は添付しないでください。** 画面を載せたいときは、ご自身の写真で、公開してよいものだけを使ってください。
        *Please do not attach personal photos. Only share images you are happy to make public.*

        加工の**仕上がりが不自然**というご報告は、専用の「仕上がりの報告」のほうが、原因を追いやすくなります。
        セキュリティやプライバシーの問題は、公開の Issue ではなく、非公開の報告をお使いください。
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか / What happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: どの機能ですか / Which feature?
      options:
        - 写真の読み込み / Loading a photo
        - 肌(なめらか・明るさ・血色・くま・ニキビ) / Skin
        - 顔立ち(小顔・目・あご・鼻) / Face shape
        - メイク(リップ・チーク・眉・歯) / Makeup
        - 背景・証明写真 / Background & ID photo
        - 構図(回転・傾き・比率・ズーム) / Composition
        - 文字 / Text
        - フィルター・質感 / Filters & texture
        - ルック(保存・複数の写真に適用) / Looks
        - 保存・共有・書き出し / Save, share & export
        - 設定 / Settings
        - その他・わからない / Other or not sure
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順 / Steps to reproduce
      placeholder: "1. 写真を選ぶ\n2. ...\n3. ..."
  - type: textarea
    id: expected
    attributes:
      label: 期待していた動き / What did you expect?
  - type: input
    id: device
    attributes:
      label: 機種と iOS のバージョン / iPhone model and iOS version
      placeholder: iPhone 16 Pro, iOS 26.0
  - type: input
    id: version
    attributes:
      label: Nuvo のバージョン / Nuvo version
      description: アプリの「設定」の一番下に表示されています。 / Shown at the bottom of Settings in the app.
      placeholder: 1.0.0 (12)
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認 / Check
      options:
        - label: 個人の写真や個人情報を含めていません / I have not included personal photos or personal information
          required: true
