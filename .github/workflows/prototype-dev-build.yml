name: Nuvo Dev iOS development build

# UI 試作(prototype/)の Development Build を作る。手動実行のみ。
# ネイティブの依存や権限を変えたときだけ必要で、JS の変更は Metro の Fast Refresh で反映される。
#
# 事前に、手元の端末で対話式の `eas build --profile development --platform ios` を一度成功させておくこと
# (EAS プロジェクトの作成と、署名情報・登録端末の設定のため)。詳細は prototype/README.md を参照。

on:
  workflow_dispatch:
    inputs:
      where:
        description: "cloud: EAS のクラウドでビルド(インストール用 URL が出る) / local: この GitHub ランナーでビルド(.ipa が成果物になる)"
        required: true
        default: cloud
        type: choice
        options:
          - cloud
          - local
      refresh_devices:
        description: "iPhone を追加登録したとき true にして、Ad Hoc プロビジョニングプロファイルを更新する"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: nuvo-dev-ios
  cancel-in-progress: false

defaults:
  run:
    working-directory: prototype

jobs:
  cloud:
    name: Build on EAS cloud
    environment: release
    if: inputs.where == 'cloud'
    # ビルド自体は EAS 側で動くため、ランナーは軽い Linux でよい。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      - name: Write App Store Connect API key
        if: inputs.refresh_devices
        working-directory: .
        env:
          KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # 貼り付けで改行が崩れても読めるよう、本体だけ取り出して PEM を作り直す(testflight.yml と同じ処理)。
          if printf '%s' "$KEY_P8_BASE64" | grep -q 'BEGIN PRIVATE KEY'; then pem=$(printf '%s' "$KEY_P8_BASE64")
          else pem=$(printf '%s' "$KEY_P8_BASE64" | tr -d ' \n\r' | base64 --decode); fi
          body=$(printf '%s' "$pem" | tr -d '\r' \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n')
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$body" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } \
            > "$RUNNER_TEMP/AuthKey.p8"
          openssl pkey -in "$RUNNER_TEMP/AuthKey.p8" -noout
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build on EAS
        env:
          # EAS の出力に含まれる、Apple アカウントの氏名と、登録した端末の UDID を伏せ字にする。
          # 公開リポジトリでは、Actions のログを誰でも読めるため。ベストエフォートなので、新しい出力を足すときは注意する。
          REDACT: 's/^(Apple Team +).*/\1***/; s/(UDID: )[0-9A-Fa-f-]{16,}/\1***/g'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: ${{ vars.APPLE_TEAM_TYPE }}
        run: |
          set -euo pipefail
          flags=""
          if [ "${{ inputs.refresh_devices }}" = "true" ]; then flags="--refresh-ad-hoc-provisioning-profile"; fi
          # --no-wait: ビルドの開始だけを行い、ランナーは待たない。進捗とインストール URL は出力された URL で見る。
          npx eas-cli@latest build --platform ios --profile development --non-interactive --no-wait $flags 2>&1 | sed -E "$REDACT"

      - name: Remove API key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  local:
    name: Build on this macOS runner (.ipa)
    environment: release
    if: inputs.where == 'local'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      - name: Select the newest Xcode
        shell: bash
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$newest" ]; then
            echo "Selecting $newest"
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          major=$(xcodebuild -version | head -n 1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$major" -lt 26 ]; then
            echo "::error::Xcode $major is too old. Use Xcode 26 or later."
            exit 1
          fi

      - name: Download iOS platform support for the selected Xcode
        run: sudo xcodebuild -downloadPlatform iOS

      - name: Build with EAS (local)
        env:
          REDACT: 's/^(Apple Team +).*/\1***/; s/(UDID: )[0-9A-Fa-f-]{16,}/\1***/g'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli@latest build \
            --local \
            --platform ios \
            --profile development \
            --non-interactive \
            --verbose-logs \
            --output ./build.ipa 2>&1 | sed -E "$REDACT"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuvo-dev-ios-development
          path: prototype/build.ipa
          if-no-files-found: error
          retention-days: 14
