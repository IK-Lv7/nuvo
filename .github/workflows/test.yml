name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    # Mac を持たない開発体制のため、ビルド・テストの検証はこのジョブに集約する。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  app:
    # アプリ本体が生成・ビルドできることを確認する(署名なし)。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or later
        # App Store Connect は iOS 26 SDK 以降(Xcode 26 以降)でのビルドを要求する。
        # ランナーに入っている中で最も新しい Xcode 26 以降を選ぶ。無ければ一覧を出して止める。
        run: |
          latest=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::No Xcode 26 or later on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: >
          xcodebuild build -project Nuvo.xcodeproj -scheme Nuvo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
