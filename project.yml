# Xcode プロジェクトは XcodeGen で生成する(.xcodeproj は Git 管理しない)。
# Mac を持たない開発体制のため、生成とビルドは CI / EAS Build 上で行う。
name: Nuvo
options:
  bundleIdPrefix: com.hinodeentertainment
  deploymentTarget:
    iOS: "17.0"
packages:
  NuvoCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Nuvo:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Features
      - path: Sources/Resources
    dependencies:
      - package: NuvoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hinodeentertainment.nuvo
        PRODUCT_NAME: Nuvo
        INFOPLIST_KEY_CFBundleDisplayName: Nuvo
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # XcodeGen はターゲット側に iPad 込みの既定値を入れるため、共通設定だけでは iPhone 専用にならない。
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 書き出し用。読み取りは PhotosPicker を使うため権限不要。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 加工した写真を保存するために使用します。写真が端末の外に送信されることはありません。
        # 標準の暗号化のみ使用(独自暗号なし)。申告を不要にする。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # 署名はこのアプリ本体のターゲットにだけ設定する。xcodebuild のコマンドライン引数として
        # 渡すと、Swift Package のリソースバンドル用ターゲット(署名を必要としない)にまで
        # 強制適用されてエラーになるため、ここ(ターゲット単位の設定)に置く。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Nuvo App Store"
